# ==============================================================================
# OxenGL Enterprise Production Docker Compose Orchestration
# Services: PostgreSQL (pgvector), FastAPI Backend, React Frontend (Nginx), Redis
# Memory Management: Explicitly tuned for 2GB Physical RAM with Swap Overhead
# ==============================================================================

services:
  # 1. High-Precision Multi-Tenant PostgreSQL Ledger Engine
  postgres_db:
    image: pgvector/pgvector:pg15
    container_name: oxengl_postgres_container
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-erp_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data_volume:/var/lib/postgresql/data
    # PostgreSQL parameters specifically tailored for a 2GB RAM host:
    # 128MB shared_buffers + 4MB work_mem capped at 60 connections safely reserves <370MB
    command: >
      postgres
      -c max_connections=60
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c maintenance_work_mem=32MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=4MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=100MB
      -c max_wal_size=1GB
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    mem_limit: 512m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-erp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oxengl_internal_network

  # 2. High-Velocity Cache & State Broker
  redis_cache:
    image: redis:7-alpine
    container_name: oxengl_redis_container
    restart: always
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data_volume:/data
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    mem_limit: 128m
    mem_reservation: 32m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - oxengl_internal_network

  # 3. OxenGL Enterprise Core Backend API Engine (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oxengl_backend_container
    restart: always
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres_db:5432/${POSTGRES_DB:-erp_db}"
      REDIS_URL: "redis://redis_cache:6379/0"
      JWT_SECRET: ${JWT_SECRET:-ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad}
      PYTHONPATH: "/app"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    mem_limit: 512m
    mem_reservation: 256m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health 2>/dev/null || curl -f http://localhost:8000/docs 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - oxengl_internal_network

  # 4. OxenGL React Frontend Interface (Served via Production Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oxengl_frontend_container
    restart: always
    ports:
      - "127.0.0.1:3000:80"
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    mem_limit: 128m
    mem_reservation: 32m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - oxengl_internal_network

  # 5. OxenGL Edge Nginx Reverse Proxy Gateway (SSL Termination & Public Routing)
  nginx:
    image: nginx:1.25-alpine
    container_name: oxengl_nginx_container
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    mem_limit: 128m
    mem_reservation: 32m
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://localhost/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - oxengl_internal_network

volumes:
  pg_data_volume:
    name: oxengl_pg_data_volume
  redis_data_volume:
    name: oxengl_redis_data_volume

networks:
  oxengl_internal_network:
    name: oxengl_internal_network
    driver: bridge
