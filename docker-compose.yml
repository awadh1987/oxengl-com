# ==============================================================================
# OxenGL Enterprise Production Compose Orchestration (Podman / podman-compose)
# Services: PostgreSQL (pgvector), FastAPI Backend, React Frontend (Nginx), Redis,
#           Edge Nginx reverse proxy
#
# Synced to the LIVE container state on srv1874240 (2026-10-03):
#   - Two networks: `oxengl_internal_network` (data plane: postgres/redis/backend)
#     and `oxengl_net` (edge plane: nginx/frontend/backend). The edge resolves
#     upstreams dynamically via Podman aardvark-dns on oxengl_net (see nginx.conf).
#   - Backend + frontend code is baked into the images (no source/dist bind mounts).
#   - Backend uses the SYNC psycopg2 driver (backend/database.py), not asyncpg.
#   - NO secrets in this file. Values come from `.env` (gitignored). Required
#     variables fail fast with `:?` instead of silently using a public default.
#
# Memory: postgres/redis carry explicit limits (2GB host); app containers are
# currently unbounded on the live host (backend ~220MB RSS).
# ==============================================================================

services:
  # 1. High-Precision Multi-Tenant PostgreSQL Ledger Engine
  postgres_db:
    image: docker.io/pgvector/pgvector:pg15
    container_name: oxengl_postgres_container
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: erp_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data_volume:/var/lib/postgresql/data
      - ./docker/postgres/init-permissions.sql:/docker-entrypoint-initdb.d/init-permissions.sql:ro
    # PostgreSQL parameters specifically tailored for a 2GB RAM host:
    # 128MB shared_buffers + 4MB work_mem capped at 60 connections safely reserves <370MB
    command: >
      postgres
      -c max_connections=60
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c maintenance_work_mem=32MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=4MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=100MB
      -c max_wal_size=1GB
    mem_limit: 512m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d${DB_NAME:-erp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oxengl_internal_network
      - oxengl_net

  # 2. High-Velocity Cache & State Broker
  redis_cache:
    image: docker.io/library/redis:7-alpine
    container_name: oxengl_redis_container
    restart: always
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data_volume:/data
    mem_limit: 128m
    mem_reservation: 32m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - oxengl_internal_network
      - oxengl_net

  # 3. OxenGL Enterprise Core Backend API Engine (FastAPI, code baked into image)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: localhost/oxen-gl_backend:latest
    container_name: oxengl_backend_container
    restart: always
    command: ["./entrypoint.sh"]
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+psycopg2://${APP_DB_USER:?APP_DB_USER must be set in .env}:${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set in .env}@postgres_db:5432/${DB_NAME:-erp_db}"
      PLATFORM_DATABASE_URL: "postgresql+psycopg2://${PLATFORM_DB_USER:?PLATFORM_DB_USER must be set in .env}:${PLATFORM_DB_PASSWORD:?PLATFORM_DB_PASSWORD must be set in .env}@postgres_db:5432/${DB_NAME:-erp_db}"
      REDIS_URL: "redis://redis_cache:6379/0"
      POSTGRES_HOST: postgres_db
      DB_USER: ${APP_DB_USER:?APP_DB_USER must be set in .env}
      DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      SYNC_WEBHOOK_SECRETS_JSON: ${SYNC_WEBHOOK_SECRETS_JSON:-}
      PYTHONPATH: "/app"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - avatar_files_volume:/app/backend/static/avatars
      - uploads_files_volume:/app/backend/static/uploads
      - crypto_keys_volume:/var/crypto/oxengl
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - oxengl_internal_network
      - oxengl_net

  # 4. OxenGL React Frontend (static build baked into the image, served by Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: localhost/oxen-gl_frontend:latest
    container_name: oxengl_frontend_container
    restart: always
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - oxengl_net

  # 5. OxenGL Edge Nginx Reverse Proxy Gateway (Direct to Web)
  nginx:
    image: docker.io/library/nginx:alpine
    container_name: oxengl_nginx_container
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro    # <-- Add this line
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - oxengl_net

volumes:
  pg_data_volume:
    name: oxengl_pg_data_volume
  redis_data_volume:
    name: oxengl_redis_data_volume
  avatar_files_volume:
    name: oxengl_avatar_files_volume
  uploads_files_volume:
    name: oxengl_uploads_files_volume
  crypto_keys_volume:
    name: oxengl_crypto_keys_volume

networks:
  oxengl_internal_network:
    name: oxengl_internal_network
    driver: bridge
  oxengl_net:
    name: oxengl_net
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.1.0/24
          gateway: 10.89.1.1