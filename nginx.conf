# ==============================================================================
# OxenGL Enterprise Production Nginx Reverse Proxy Configuration
# Handles SSL Termination, High-Efficiency Gzip, and Secure Cluster Routing
# Optimized for 2GB Host Memory Limits & Micro-Service Mesh
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance & Low-Memory Buffer Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Client Buffers (tailored to 2GB physical RAM)
    client_body_buffer_size 128k;
    client_max_body_size 50M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Logging Format
    log_format main_extended '$remote_addr - $remote_user [$time_local] "$request" '
                             '$status $body_bytes_sent "$http_referer" '
                             '"$http_user_agent" "$http_x_forwarded_for" '
                             'rt=$request_time uct="$upstream_connect_time" '
                             'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main_extended;
    error_log /var/log/nginx/error.log warn;

    # ==========================================================================
    # GZIP COMPRESSION CONFIGURATION
    # ==========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        application/vnd.ms-fontobject
        image/svg+xml
        font/truetype
        font/opentype
        font/woff
        font/woff2;

    # Upstream Routing Definitions
    upstream oxengl_frontend {
        server frontend:80;
        keepalive 32;
    }

    upstream oxengl_backend {
        server backend:8000;
        keepalive 32;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ==========================================================================
    # 1. HTTP Ingress (Port 80) - Enforce HTTPS Redirect & ACME Challenges
    # ==========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name oxengl.me *.oxengl.me oxengl.com www.oxengl.com localhost;

        # ACME Challenge Validation for Let's Encrypt SSL Certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Force SSL Redirection
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================================================
    # 2. Hardened HTTPS Gateway Server Context (Port 443)
    # ==========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name oxengl.me *.oxengl.me oxengl.com www.oxengl.com localhost;

        # SSL Certificates (Let's Encrypt / Fallback Paths)
        ssl_certificate /etc/letsencrypt/live/oxengl.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/oxengl.me/privkey.pem;

        # Modern Cryptographic Cipher Isolation (Strict OWASP/Mozilla Guidelines)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

        # SSL Session Parameters (Memory-optimized for 2GB host)
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Enterprise Protection Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval' ws: wss:;" always;

        # A. ROUTE: Frontend React SPA Application
        location / {
            proxy_pass http://oxengl_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        # B. ROUTE: Backend Async REST API Engine
        location /api/ {
            proxy_pass http://oxengl_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # C. ROUTE: Interactive OpenAPI & Redoc Documentation
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://oxengl_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # D. ROUTE: Asynchronous WebSocket Telemetry Stream Proxy
        location /api/v1/logistics/ws {
            proxy_pass http://oxengl_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }
    }
}
