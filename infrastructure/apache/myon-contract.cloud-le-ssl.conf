<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName myon-contract.cloud
    ServerAlias www.myon-contract.cloud

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8080/ upgrade=websocket
    ProxyPassReverse / http://127.0.0.1:8080/

    ErrorLog ${APACHE_LOG_DIR}/myon-contract_error.log
    CustomLog ${APACHE_LOG_DIR}/myon-contract_access.log combined

    SSLCertificateFile /etc/letsencrypt/live/myon-contract.cloud/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/myon-contract.cloud/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>

# OxenGL WebSocket and Reverse Proxy Bridge
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName oxengl.me
    ServerAlias *.oxengl.me

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8080/ upgrade=websocket
    ProxyPassReverse / http://127.0.0.1:8080/

    ErrorLog ${APACHE_LOG_DIR}/oxengl_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/oxengl_ssl_access.log combined

    SSLCertificateFile /etc/letsencrypt/live/oxengl.me/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/oxengl.me/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
