version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: oxengl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oxengl}
      POSTGRES_USER: ${POSTGRES_USER:-oxengl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oxengl}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema_multi_tenant_rls.sql:/docker-entrypoint-initdb.d/01_schema_multi_tenant_rls.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oxengl} -d ${POSTGRES_DB:-oxengl}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: oxengl-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.saas
    container_name: oxengl-saas-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-oxengl}:${POSTGRES_PASSWORD:-oxengl}@postgres:5432/${POSTGRES_DB:-oxengl}
      REDIS_URL: redis://redis:6379
      AUTO_MIGRATE: "true"
      NODE_ENV: production
      PORT: 3000
      BACKEND_PORT: 8000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_SECRET_MASTER: ${JWT_SECRET_MASTER:?JWT_SECRET_MASTER must be set}
      JWT_SECRET_TENANT: ${JWT_SECRET_TENANT:?JWT_SECRET_TENANT must be set}
      DATA_RESIDENCY_KEY: ${DATA_RESIDENCY_KEY:?DATA_RESIDENCY_KEY must be set}
    ports:
      - "3000:3000"
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  redisdata:
